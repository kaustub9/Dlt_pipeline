# The main pipeline for demobundle

resources:
  pipelines:
    demobundle_etl:
      name: demobundle_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/demobundle_etl"

      libraries:
        - glob:
            include: ../src/demobundle_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
